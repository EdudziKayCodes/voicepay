services:
  - type: web
    name: voicepay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GROQ_API_KEY
        sync: false
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: ALLOW_RESET
        value: "0"
      - key: PROXY_FIX_HOPS
        value: "1"
      - key: REDIS_URL
        sync: false
